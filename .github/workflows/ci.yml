name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run test:helper

  integration-tests:
    # Runs the real Extension Development Host suite (@vscode/test-electron). This job needs
    # normal internet access to download a VS Code test binary — it could not be executed
    # inside this project's own network-restricted build sandbox (see ARCHITECTURE.md
    # "Testing strategy"), but runs normally on GitHub's standard runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
